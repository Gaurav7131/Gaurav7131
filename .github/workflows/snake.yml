name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Gaurav7131
          # color_dots takes exactly 5 colors: [0 contributions, low, ..., highest]
          # The first value controls the "empty day" cells - set to a faint green
          # instead of grey so the whole grid reads as green.
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#216e39&color_dots=#e8f6ec,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-contribution-grid-snake-dark.svg?color_snake=#39d353&color_dots=#10281b,#0e4429,#006d32,#26a641,#39d353

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
